<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Inspection History</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #163051;
      padding: 18px;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .top img {
      max-width: 220px;
      background: white;
      padding: 8px;
      border-radius: 12px;
    }

    h1 {
      margin: 12px 0 4px;
    }

    p {
      color: #60708a;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(22,48,81,0.08);
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dee9;
      border-radius: 12px;
      font-size: 16px;
      margin: 10px 0 18px;
    }

    button, .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: #af2727;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      display: inline-block;
    }

    .blue {
      background: #163051;
    }

    .light {
      background: #eef3fa;
      color: #163051;
    }

    .green {
      background: #1d7f4f;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .inspection {
      border-left: 5px solid #af2727;
    }

    .inspection h3 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .meta {
      color: #60708a;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef3fa;
      color: #163051;
      font-weight: bold;
      font-size: 12px;
    }

    .notice {
      font-weight: bold;
      margin: 12px 0;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .top {
        justify-content: center;
        text-align: center;
      }

      button, .btn {
        width: 100%;
        text-align: center;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="top">
      <img src="/logo.png" alt="Toro's Auto Care">
      <a class="btn blue" href="/admin">Back to Admin</a>
    </div>

    <div class="card">
      <h1>Inspection History</h1>
      <p>Search past inspections by customer name, phone, vehicle, date, or status.</p>

      <input id="searchInput" placeholder="Search inspections..." oninput="renderInspections()">

      <div class="actions">
        <button onclick="loadInspections()">Refresh History</button>
        <a class="btn green" href="/admin/inspection">Create New Inspection</a>
      </div>

      <div class="notice" id="notice">Loading inspections...</div>
    </div>

    <div id="inspectionList"></div>
  </div>

  <script>
    const ADMIN_PASSWORD = "toros123";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwj6Og0BbLsS6kRmMTfIXMFD3g8IbPbH3L7QpTbjpSx9PFeHItbVNZWwi6X4VxlzM1Btw/exec";

    let inspections = [];

    async function loadInspections() {
      const notice = document.getElementById("notice");
      notice.textContent = "Loading inspections...";
      notice.style.color = "#163051";

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getInspections&password=${encodeURIComponent(ADMIN_PASSWORD)}`);
        const data = await response.json();

        if (data.status !== "success") {
          notice.textContent = data.message || "Could not load inspections.";
          notice.style.color = "#af2727";
          return;
        }

        inspections = data.inspections || [];
        notice.textContent = `${inspections.length} inspection(s) found.`;
        notice.style.color = "#1d7f4f";
        renderInspections();

      } catch (err) {
        notice.textContent = "Could not load inspections.";
        notice.style.color = "#af2727";
      }
    }

    function renderInspections() {
      const list = document.getElementById("inspectionList");
      const search = document.getElementById("searchInput").value.toLowerCase();

      const filtered = inspections.filter(item => {
        const text = [
          item.inspectionId,
          item.createdAt,
          item.customerName,
          item.phone,
          item.email,
          item.vehicle,
          item.mileage,
          item.technician,
          item.overallStatus,
          item.recommendations
        ].join(" ").toLowerCase();

        return text.includes(search);
      });

      if (!filtered.length) {
        list.innerHTML = `<div class="card">No inspections found.</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const reportLink = `${window.location.origin}/inspection?id=${item.inspectionId}`;

        return `
          <div class="card inspection">
            <h3>${escapeHTML(item.customerName || "Customer")}</h3>

            <div class="meta">
              <strong>Vehicle:</strong> ${escapeHTML(item.vehicle || "Not provided")}<br>
              <strong>Phone:</strong> ${escapeHTML(item.phone || "Not provided")}<br>
              <strong>Email:</strong> ${escapeHTML(item.email || "Not provided")}<br>
              <strong>Mileage:</strong> ${escapeHTML(item.mileage || "Not provided")}<br>
              <strong>Technician:</strong> ${escapeHTML(item.technician || "Not provided")}<br>
              <strong>Created:</strong> ${escapeHTML(item.createdAt || "Not provided")}<br>
              <strong>ID:</strong> ${escapeHTML(item.inspectionId)}
            </div>

            <div class="status">${escapeHTML(item.overallStatus || "Monitor")}</div>

            <div class="actions">
              <a class="btn blue" href="${reportLink}" target="_blank">Open Report</a>
              <button class="light" onclick="copyText('${reportLink}')">Copy Link</button>
              ${item.phone ? `<a class="btn light" href="tel:${String(item.phone).replace(/\D/g, "")}">Call</a>` : ""}
              ${item.email ? `<a class="btn light" href="mailto:${escapeHTML(item.email)}">Email</a>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      const notice = document.getElementById("notice");
      notice.textContent = "Inspection link copied.";
      notice.style.color = "#1d7f4f";
    }

    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    loadInspections();
  </script>

</body>
</html>
