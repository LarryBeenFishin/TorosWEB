<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Customer Profiles</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #163051;
    }

    header {
      background: #163051;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header img {
      height: 54px;
      background: white;
      padding: 6px;
      border-radius: 10px;
    }

    button, .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: #af2727;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      display: inline-block;
    }

    button:hover, .btn:hover {
      background: #911f1f;
    }

    .green {
      background: #1d7f4f;
    }

    .green:hover {
      background: #17683f;
    }

    .wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
    }

    .top-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(22,48,81,0.08);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dee9;
      border-radius: 12px;
      font-size: 16px;
      margin-top: 14px;
      box-sizing: border-box;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    .customer-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(22,48,81,0.08);
      border-left: 5px solid #af2727;
    }

    .customer-card h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .line {
      font-size: 14px;
      margin: 6px 0;
      color: #40506a;
    }

    .line strong {
      color: #163051;
    }

    .pill {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eaf0f7;
      color: #163051;
      font-size: 12px;
      font-weight: bold;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 24px;
      color: #777;
    }

    @media (max-width: 700px) {
      header {
        justify-content: center;
        text-align: center;
      }

      .wrap {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <img src="/logo.png" alt="Toro's Auto Care">
    <div>
      <a href="/admin" class="btn green">Back to Admin</a>
      <button onclick="loadCustomers()">Refresh</button>
    </div>
  </header>

  <main class="wrap">
    <div class="top-card">
      <h1>Customer Profiles</h1>
      <div>Search customers by name, phone, vehicle, or service.</div>
      <input id="searchInput" oninput="renderCustomers()" placeholder="Search customers...">
    </div>

    <div id="customersGrid" class="grid">
      <div class="empty">Loading customers...</div>
    </div>
  </main>

  <script>
    let customers = [];

    async function loadCustomers() {
      const grid = document.getElementById("customersGrid");
      grid.innerHTML = '<div class="empty">Loading customers...</div>';

      try {
        const response = await fetch("/api/get-customers");
        const data = await response.json();

        customers = data.customers || [];
        renderCustomers();

      } catch (err) {
        grid.innerHTML = '<div class="empty">Could not load customers.</div>';
      }
    }

    function renderCustomers() {
      const grid = document.getElementById("customersGrid");
      const search = document.getElementById("searchInput").value.toLowerCase();

      const filtered = customers.filter(c => {
        return [
          c.name,
          c.phone,
          c.email,
          c.vehicle,
          c.lastService,
          c.notes
        ].join(" ").toLowerCase().includes(search);
      });

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">No customers found.</div>';
        return;
      }

      grid.innerHTML = filtered.map(c => `
        <div class="customer-card">
          <h3>${escapeHtml(c.name || "Customer")}</h3>

          <div class="line"><strong>Phone:</strong> ${escapeHtml(c.phone || "")}</div>
          <div class="line"><strong>Email:</strong> ${escapeHtml(c.email || "Not provided")}</div>
          <div class="line"><strong>Vehicle:</strong> ${escapeHtml(c.vehicle || "Not provided")}</div>
          <div class="line"><strong>Last Service:</strong> ${escapeHtml(c.lastService || "None")}</div>
          <div class="line"><strong>Last Appointment:</strong> ${escapeHtml(c.lastAppointmentDate || "None")} ${escapeHtml(c.lastAppointmentTime || "")}</div>
          <div class="line"><strong>Total Appointments:</strong> ${escapeHtml(c.totalAppointments || "0")}</div>
          <div class="line"><strong>Last Inspection:</strong> ${escapeHtml(c.lastInspectionId || "None")}</div>
          <div class="line"><strong>Notes:</strong> ${escapeHtml(c.notes || "None")}</div>

          <span class="pill">Updated: ${escapeHtml(c.lastUpdated || "")}</span>
        </div>
      `).join("");
    }

    function escapeHtml(text) {
      return String(text || "").replace(/[&<>"']/g, function(match) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[match];
      });
    }

    loadCustomers();
  </script>
</body>
</html>
