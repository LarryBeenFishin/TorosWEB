<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toro's Auto Care Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #163051;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #163051, #0c1b30);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-card img {
      max-width: 220px;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dee9;
      border-radius: 12px;
      font-size: 16px;
      margin: 12px 0;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: #af2727;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #911f1f;
    }

    .admin {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #163051;
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header img {
      height: 54px;
      background: white;
      padding: 6px;
      border-radius: 10px;
    }

    .dashboard {
      padding: 24px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(22,48,81,0.08);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-name {
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      color: #61708a;
    }

    .day {
      min-height: 86px;
      border: 1px solid #e4e9f2;
      border-radius: 12px;
      padding: 8px;
      background: #fbfcff;
      font-size: 13px;
    }

    .day.today {
      border: 2px solid #af2727;
      background: #fff7f7;
    }

    .day-number {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .appointment-dot {
      background: #163051;
      color: white;
      border-radius: 8px;
      padding: 4px 6px;
      margin-top: 4px;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .appointment {
      border-left: 4px solid #af2727;
      background: #f8fafd;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .appointment strong {
      display: block;
      margin-bottom: 4px;
    }

    .appointment small {
      color: #60708a;
      display: block;
      margin-top: 3px;
    }

    .empty {
      color: #7b8797;
      font-size: 14px;
    }

    .error {
      color: #af2727;
      font-size: 14px;
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .day {
        min-height: 70px;
      }

      header {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <section class="login-screen" id="loginScreen">
    <div class="login-card">
      <img src="/logo.png" alt="Toro's Auto Care Logo">

      <h2>Admin Login</h2>
      <p>Private appointment dashboard</p>

      <input type="password" id="passwordInput" placeholder="Enter password" />

      <button onclick="login()">Login</button>

      <div class="error" id="loginError"></div>
    </div>
  </section>

  <section class="admin" id="adminDashboard">
    <header>
      <div>
        <img src="/logo.png" alt="Toro's Auto Care Logo">
      </div>

      <div>
        <button onclick="loadAppointments()">Refresh Appointments</button>
        <button onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="dashboard">

      <div class="card">
        <div class="calendar-header">
          <button onclick="changeMonth(-1)">←</button>
          <h2 id="monthTitle">Calendar</h2>
          <button onclick="changeMonth(1)">→</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <div class="side">

        <div class="card">
          <h2>Today's Appointments</h2>
          <div id="todayAppointments" class="empty">Loading...</div>
        </div>

        <div class="card">
          <h2>Upcoming Appointments</h2>
          <div id="upcomingAppointments" class="empty">Loading...</div>
        </div>

      </div>

    </main>
  </section>

  <script>

    const ADMIN_PASSWORD = "toros123";

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwj6Og0BbLsS6kRmMTfIXMFD3g8IbPbH3L7QpTbjpSx9PFeHItbVNZWwi6X4VxlzM1Btw/exec";

    let appointments = [];

    let currentDate = new Date();

    function login() {

      const password = document.getElementById("passwordInput").value;

      const error = document.getElementById("loginError");

      if (password === ADMIN_PASSWORD) {

        localStorage.setItem("torosAdminLoggedIn", "true");

        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("adminDashboard").style.display = "block";

        loadAppointments();

      } else {

        error.textContent = "Incorrect password.";

      }

    }

    function logout() {

      localStorage.removeItem("torosAdminLoggedIn");

      location.reload();

    }

    async function loadAppointments() {

      try {

        const response = await fetch(SCRIPT_URL + "?action=getAppointments");

        const data = await response.json();

        appointments = Array.isArray(data)
          ? data
          : data.appointments || [];

        renderCalendar();

        renderLists();

      } catch (error) {

        console.error(error);

        document.getElementById("todayAppointments").innerHTML =
          "Could not load appointments.";

        document.getElementById("upcomingAppointments").innerHTML =
          "Could not load appointments.";

      }

    }

    function renderCalendar() {

      const grid = document.getElementById("calendarGrid");

      const monthTitle = document.getElementById("monthTitle");

      grid.innerHTML = "";

      const year = currentDate.getFullYear();

      const month = currentDate.getMonth();

      monthTitle.textContent = currentDate.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric"
      });

      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      dayNames.forEach(day => {

        const div = document.createElement("div");

        div.className = "day-name";

        div.textContent = day;

        grid.appendChild(div);

      });

      const firstDay = new Date(year, month, 1).getDay();

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {

        const blank = document.createElement("div");

        grid.appendChild(blank);

      }

      for (let day = 1; day <= daysInMonth; day++) {

        const dateBox = document.createElement("div");

        dateBox.className = "day";

        const fullDate = new Date(year, month, day);

        const dateKey = formatDate(fullDate);

        const todayKey = formatDate(new Date());

        if (dateKey === todayKey) {

          dateBox.classList.add("today");

        }

        dateBox.innerHTML = `<div class="day-number">${day}</div>`;

        const dayAppointments = appointments.filter(app => {

          return formatAppointmentDate(app) === dateKey;

        });

        dayAppointments.slice(0, 3).forEach(app => {

          const dot = document.createElement("div");

          dot.className = "appointment-dot";

          dot.textContent =
            `${app.time || ""} ${app.name || app.customer || "Appointment"}`;

          dateBox.appendChild(dot);

        });

        grid.appendChild(dateBox);

      }

    }

    function renderLists() {

      const todayContainer =
        document.getElementById("todayAppointments");

      const upcomingContainer =
        document.getElementById("upcomingAppointments");

      const todayKey = formatDate(new Date());

      const todayApps = appointments.filter(app =>
        formatAppointmentDate(app) === todayKey
      );

      const upcomingApps = appointments
        .filter(app => formatAppointmentDate(app) > todayKey)
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(0, 8);

      todayContainer.innerHTML = todayApps.length
        ? todayApps.map(renderAppointment).join("")
        : `<p class="empty">No appointments today.</p>`;

      upcomingContainer.innerHTML = upcomingApps.length
        ? upcomingApps.map(renderAppointment).join("")
        : `<p class="empty">No upcoming appointments.</p>`;

    }

    function renderAppointment(app) {

      return `
        <div class="appointment">

          <strong>${app.name || app.customer || "Customer"}</strong>

          <small>${app.date || ""} ${app.time || ""}</small>

          <small>${app.vehicle || ""}</small>

          <small>${app.service || app.reason || ""}</small>

          <small>${app.phone || ""}</small>

        </div>
      `;

    }

    function formatDate(date) {

      const y = date.getFullYear();

      const m = String(date.getMonth() + 1).padStart(2, "0");

      const d = String(date.getDate()).padStart(2, "0");

      return `${y}-${m}-${d}`;

    }

    function formatAppointmentDate(app) {

      if (!app.date) return "";

      const date = new Date(app.date);

      if (isNaN(date)) return app.date;

      return formatDate(date);

    }

    function changeMonth(amount) {

      currentDate.setMonth(currentDate.getMonth() + amount);

      renderCalendar();

    }

    window.onload = function () {

      if (
        localStorage.getItem("torosAdminLoggedIn") === "true"
      ) {

        document.getElementById("loginScreen").style.display =
          "none";

        document.getElementById("adminDashboard").style.display =
          "block";

        loadAppointments();

      }

    };

  </script>

</body>
</html>
