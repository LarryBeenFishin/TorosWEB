<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toro's Auto Care Admin</title>

  <style>
    * { box-sizing:border-box; }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      color:#163051;
      overflow-x:hidden;
    }

    button{
      border:none;
      border-radius:12px;
      padding:12px 18px;
      background:#af2727;
      color:white;
      font-weight:bold;
      cursor:pointer;
      font-size:15px;
    }

    button:hover{
      background:#911f1f;
    }

    input,select,textarea{
      width:100%;
      padding:12px;
      border:1px solid #d8dee9;
      border-radius:12px;
      font-size:15px;
      font-family:Arial,sans-serif;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:bold;
      margin:10px 0 6px;
      color:#163051;
    }

    .login-screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:linear-gradient(135deg,#163051,#0c1b30);
    }

    .login-card{
      width:100%;
      max-width:420px;
      background:white;
      padding:32px;
      border-radius:20px;
      box-shadow:0 20px 50px rgba(0,0,0,0.25);
      text-align:center;
    }

    .login-card img{
      max-width:220px;
      margin-bottom:20px;
    }

    .admin{
      display:none;
      min-height:100vh;
    }

    header{
      background:#163051;
      color:white;
      padding:16px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    header img{
      height:54px;
      background:white;
      padding:6px;
      border-radius:10px;
    }

    .header-buttons{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .dashboard{
      padding:24px;
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(320px,0.8fr);
      gap:22px;
      max-width:1500px;
      margin:0 auto;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:20px;
      box-shadow:0 8px 24px rgba(22,48,81,0.08);
      min-width:0;
    }

    .calendar-header{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }

    .calendar-title-wrap{
      text-align:center;
    }

    .calendar-title-wrap h2{
      margin:0 0 10px;
      font-size:30px;
    }

    .today-btn{
      background:#163051;
    }

    .light-btn{
      background:#eef3fa;
      color:#163051;
    }

    .light-btn:hover{
      background:#dfe8f4;
    }

    .success-btn{
      background:#1d7f4f;
    }

    .success-btn:hover{
      background:#17683f;
    }

    .calendar-grid{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:8px;
      width:100%;
    }

    .day-name{
      text-align:center;
      font-weight:bold;
      font-size:13px;
      color:#61708a;
      padding:4px 0;
    }

    .day{
      min-height:92px;
      border:1px solid #e4e9f2;
      border-radius:12px;
      padding:8px;
      background:#fbfcff;
      font-size:13px;
      min-width:0;
      overflow:hidden;
    }

    .day.today{
      border:2px solid #af2727;
      background:#fff7f7;
    }

    .day-number{
      font-weight:bold;
      margin-bottom:6px;
    }

    .appointment-dot{
      background:#163051;
      color:white;
      border-radius:8px;
      padding:5px 7px;
      margin-top:4px;
      font-size:11px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      cursor:pointer;
    }

    .appointment-dot:hover{
      background:#af2727;
    }

    .side{
      display:flex;
      flex-direction:column;
      gap:22px;
      min-width:0;
    }

    .appointment{
      border-left:4px solid #af2727;
      background:#f8fafd;
      padding:12px;
      border-radius:12px;
      margin-bottom:10px;
      cursor:pointer;
    }

    .appointment:hover{
      background:#eef4ff;
    }

    .appointment strong{
      display:block;
      margin-bottom:4px;
    }

    .appointment small{
      color:#60708a;
      display:block;
      margin-top:3px;
    }

    .status-pill{
      display:inline-block;
      margin-top:7px;
      padding:4px 8px;
      border-radius:999px;
      background:#eaf0f7;
      color:#163051;
      font-size:11px;
      font-weight:bold;
    }

    .empty{
      color:#7b8797;
      font-size:14px;
    }

    .error{
      color:#af2727;
      font-size:14px;
      margin-top:8px;
    }

    @media(max-width:900px){

      header{
        justify-content:center;
        text-align:center;
        padding:24px 14px;
      }

      header img{
        height:70px;
      }

      .header-buttons{
        justify-content:center;
        width:100%;
      }

      .dashboard{
        grid-template-columns:1fr;
        padding:14px;
        gap:16px;
      }

      .card{
        padding:14px;
        border-radius:16px;
      }

      .calendar-header{
        grid-template-columns:44px 1fr 44px;
        gap:8px;
      }

      .calendar-header button{
        padding:10px;
        min-width:44px;
      }

      .calendar-title-wrap h2{
        font-size:24px;
      }

      .calendar-grid{
        gap:5px;
      }

      .day-name{
        font-size:11px;
      }

      .day{
        min-height:74px;
        padding:5px;
        font-size:12px;
        border-radius:10px;
      }

      .appointment-dot{
        font-size:10px;
        padding:4px 5px;
      }

      .header-buttons button{
        font-size:14px;
        padding:12px 14px;
      }
    }
  </style>
</head>

<body>

<section class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="/logo.png" alt="Toro's Auto Care Logo">
    <h2>Admin Login</h2>
    <p>Private appointment dashboard</p>

    <input type="password" id="passwordInput" placeholder="Enter password" />

    <button onclick="login()">Login</button>

    <div class="error" id="loginError"></div>
  </div>
</section>

<section class="admin" id="adminDashboard">

  <header>

    <img src="/logo.png" alt="Toro's Auto Care Logo">

    <div class="header-buttons">

      <button class="success-btn" onclick="openCreateModal()">
        + New Appointment
      </button>

      <a href="/admin/inspection" style="text-decoration:none;">
        <button class="success-btn">
          Inspection Form
        </button>
      </a>

      <button onclick="loadAppointments()">
        Refresh Appointments
      </button>

      <button class="today-btn" onclick="goToToday()">
        Today
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </header>

  <main class="dashboard">

    <div class="card">

      <div class="calendar-header">

        <button onclick="changeMonth(-1)">←</button>

        <div class="calendar-title-wrap">
          <h2 id="monthTitle">Calendar</h2>
        </div>

        <button onclick="changeMonth(1)">→</button>

      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

    </div>

    <div class="side">

      <div class="card">
        <h2>Today's Appointments</h2>
        <div id="todayAppointments" class="empty">Loading...</div>
      </div>

      <div class="card">
        <h2>Upcoming Appointments</h2>
        <div id="upcomingAppointments" class="empty">Loading...</div>
      </div>

    </div>

  </main>

</section>

<script>
const ADMIN_PASSWORD = "toros123";

function login(){
  const password=document.getElementById("passwordInput").value;
  const error=document.getElementById("loginError");

  if(password===ADMIN_PASSWORD){
    localStorage.setItem("torosAdminLoggedIn","true");
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("adminDashboard").style.display="block";
  }else{
    error.textContent="Incorrect password.";
  }
}

function logout(){
  localStorage.removeItem("torosAdminLoggedIn");
  location.reload();
}

function goToToday(){
  location.reload();
}

function openCreateModal(){
  alert("Create appointment modal still connected.");
}

function loadAppointments(){
  console.log("Appointments loading...");
}

function changeMonth(amount){
  console.log("Month changed:", amount);
}

window.onload=function(){
  if(localStorage.getItem("torosAdminLoggedIn")==="true"){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("adminDashboard").style.display="block";
  }
};

document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && document.activeElement.id==="passwordInput"){
    login();
  }
});
</script>

</body>
</html>
