<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Vehicle Inspection Report</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #163051;
      padding: 24px;
    }

    .report {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .logo {
      max-width: 220px;
    }

    .print-btn {
      background: #163051;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #60708a;
      margin-bottom: 24px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section h2 {
      border-bottom: 2px solid #e5ebf3;
      padding-bottom: 10px;
      margin-bottom: 18px;
      font-size: 22px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .info-card {
      background: #f7faff;
      border: 1px solid #e3eaf4;
      border-radius: 14px;
      padding: 14px;
    }

    .info-card strong {
      display: block;
      margin-bottom: 6px;
      color: #163051;
    }

    .inspection-item {
      border: 1px solid #e2e7ef;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .inspection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .inspection-title {
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      border: 2px solid black;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      background: white;
      color: black;
    }

    .recommendations {
      white-space: pre-wrap;
      line-height: 1.6;
      background: #f7faff;
      border: 1px solid #e3eaf4;
      padding: 16px;
      border-radius: 14px;
    }

    .loading {
      text-align: center;
      font-size: 18px;
      padding: 60px 20px;
    }

    .error {
      text-align: center;
      color: #af2727;
      font-size: 18px;
      padding: 60px 20px;
    }

    @media print {
      @page {
        size: letter;
        margin: 0.35in;
      }

      body {
        background: white !important;
        padding: 0 !important;
        font-size: 10px;
        color: black !important;
      }

      .report,
      .info-card,
      .inspection-item,
      .recommendations {
        background: white !important;
        box-shadow: none !important;
      }

      .report {
        border-radius: 0;
        max-width: 100%;
        padding: 0;
      }

      .print-btn {
        display: none !important;
      }

      .topbar {
        margin-bottom: 8px;
      }

      .logo {
        max-width: 125px;
        filter: grayscale(100%);
      }

      h1 {
        font-size: 20px;
        margin-bottom: 3px;
        color: black !important;
      }

      .subtitle {
        margin-bottom: 8px;
        font-size: 10px;
        color: black !important;
      }

      .section {
        margin-bottom: 8px;
        break-inside: avoid;
      }

      .section h2 {
        font-size: 14px;
        margin-bottom: 6px;
        padding-bottom: 3px;
        border-bottom: 1px solid black;
        color: black !important;
      }

      .info-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }

      .info-card {
        padding: 5px;
        border: 1px solid black;
        font-size: 9px;
        border-radius: 0;
        color: black !important;
      }

      .inspection-item {
        padding: 6px;
        margin-bottom: 4px;
        border: 1px solid black;
        border-radius: 0;
        break-inside: avoid;
        color: black !important;
      }

      .inspection-header {
        margin-bottom: 2px;
      }

      .inspection-title {
        font-size: 11px;
        color: black !important;
      }

      .status {
        font-size: 8px;
        padding: 2px 5px;
        border: 1px solid black;
        border-radius: 0;
        background: white !important;
        color: black !important;
      }

      .recommendations {
        padding: 6px;
        border: 1px solid black;
        font-size: 9px;
        line-height: 1.2;
        color: black !important;
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .report {
        padding: 22px;
      }

      h1 {
        font-size: 28px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .print-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="report" id="report">
    <div class="loading">Loading inspection report...</div>
  </div>

  <script>
    const INSPECTION_API = "/api/public-inspection";

    const params = new URLSearchParams(window.location.search);
    const inspectionId = params.get("id");

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadInspection() {
      const report = document.getElementById("report");

      if (!inspectionId) {
        report.innerHTML = `<div class="error">Missing inspection ID.</div>`;
        return;
      }

      try {
        const response = await fetch(
          `${INSPECTION_API}?id=${encodeURIComponent(inspectionId)}`
        );

        const data = await response.json();

        if (data.status !== "success") {
          report.innerHTML = `<div class="error">Inspection not found.</div>`;
          return;
        }

        const inspection = data.inspection;

        report.innerHTML = `
          <div class="topbar">
            <img class="logo" src="/logo.png" alt="Toro's Auto Care">

            <button class="print-btn" onclick="window.print()">
              Print Report
            </button>
          </div>

          <h1>Vehicle Inspection Report</h1>

          <div class="subtitle">
            Inspection ID: ${escapeHTML(inspection.inspectionId)}
          </div>

          <div class="section">
            <h2>Customer & Vehicle Information</h2>

            <div class="info-grid">
              <div class="info-card">
                <strong>Customer</strong>
                ${escapeHTML(inspection.customerName || "-")}
              </div>

              <div class="info-card">
                <strong>Phone</strong>
                ${escapeHTML(inspection.phone || "-")}
              </div>

              <div class="info-card">
                <strong>Vehicle</strong>
                ${escapeHTML(inspection.vehicle || "-")}
              </div>

              <div class="info-card">
                <strong>Mileage</strong>
                ${escapeHTML(inspection.mileage || "-")}
              </div>

              <div class="info-card">
                <strong>Technician</strong>
                ${escapeHTML(inspection.technician || "-")}
              </div>

              <div class="info-card">
                <strong>Overall Status</strong>
                <span class="status">${formatStatus(inspection.overallStatus)}</span>
              </div>
            </div>
          </div>

          <div class="section">
            <h2>Inspection Results</h2>

            ${renderItem("Brakes", inspection.brakesStatus, inspection.brakesNotes)}
            ${renderItem("Tires", inspection.tiresStatus, inspection.tiresNotes)}
            ${renderItem("Suspension", inspection.suspensionStatus, inspection.suspensionNotes)}
            ${renderItem("Fluids", inspection.fluidsStatus, inspection.fluidsNotes)}
            ${renderItem("Battery", inspection.batteryStatus, inspection.batteryNotes)}
            ${renderItem("Lights", inspection.lightsStatus, inspection.lightsNotes)}
            ${renderItem("Wipers", inspection.wipersStatus, inspection.wipersNotes)}
            ${renderItem("Filters", inspection.filtersStatus, inspection.filtersNotes)}
            ${renderItem("Leaks", inspection.leaksStatus, inspection.leaksNotes)}
          </div>

          <div class="section">
            <h2>Recommendations</h2>

            <div class="recommendations">
              ${escapeHTML(inspection.recommendations || "No recommendations added.")}
            </div>
          </div>
        `;

      } catch (err) {
        report.innerHTML = `<div class="error">Could not load inspection.</div>`;
      }
    }

    function renderItem(title, status, notes) {
      return `
        <div class="inspection-item">
          <div class="inspection-header">
            <div class="inspection-title">${escapeHTML(title)}</div>

            <div class="status">
              ${formatStatus(status)}
            </div>
          </div>

          <div>
            ${escapeHTML(notes || "No notes added.")}
          </div>
        </div>
      `;
    }

    function formatStatus(status) {
      if (!status) return "-";

      const value = status.toLowerCase();

      if (value.includes("good")) return "✓ GOOD";
      if (value.includes("monitor")) return "! MONITOR";
      if (value.includes("attention")) return "X NEEDS ATTENTION";

      return status.toUpperCase();
    }

    loadInspection();
  </script>

</body>
</html>
